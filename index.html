<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Brainrot Upgrader 3000</title>
    <style>
        body {
            background-color: #12121a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #ff007f; text-shadow: 0 0 10px #ff007f; }
        .arena {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            background: #1e1e2e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        .slot {
            width: 160px;
            height: 200px;
            border: 2px dashed #444;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            background: #161622;
        }
        .slot.active { border: 2px solid #00f0ff; }
        .wheel-container {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(#00ff88 0% 50%, #2a2a3d 50% 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .wheel-inner {
            width: 140px;
            height: 140px;
            background: #1e1e2e;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        .pointer {
            position: absolute;
            top: -12px;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 18px solid #ff007f;
            z-index: 3;
            transform-origin: 50% 102px;
            transition: transform 3s cubic-bezier(0.15, 0.85, 0.25, 1);
        }
        button {
            background: linear-gradient(45deg, #ff007f, #7000ff);
            border: none;
            color: white;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .lists {
            display: flex;
            gap: 30px;
            width: 100%;
            max-width: 800px;
        }
        .box {
            flex: 1;
            background: #1e1e2e;
            padding: 15px;
            border-radius: 10px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .card {
            background: #28283d;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .card:hover { border-color: #00f0ff; }
        .emoji { font-size: 36px; display: block; margin-bottom: 5px; }
        .price { color: #00ff88; font-weight: bold; font-size: 14px; }
        #status { font-size: 20px; font-weight: bold; height: 28px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h1>🧠 BRAINROT UPGRADER 🧠</h1>
    <div id="status">Выбери свой брейнрот и цель!</div>

    <div class="arena">
        <div class="slot" id="mySlot">
            <span>Твой предмет</span>
        </div>

        <div class="wheel-container">
            <div class="pointer" id="pointer"></div>
            <div class="wheel" id="wheel">
                <div class="wheel-inner">
                    <span id="chanceText" style="font-size: 24px; font-weight: bold;">0%</span>
                    <span style="font-size: 12px; color: #aaa;">ШАНС</span>
                </div>
            </div>
        </div>

        <div class="slot" id="targetSlot">
            <span>Цель апгрейда</span>
        </div>
    </div>

    <button id="upgradeBtn" disabled onclick="startUpgrade()">АПГРЕЙДНУТЬ</button>

    <div class="lists" style="margin-top: 25px;">
        <div class="box">
            <h3>🎒 Твой инвентарь</h3>
            <div class="grid" id="inventoryGrid"></div>
        </div>
        <div class="box">
            <h3>🎯 Каталог целей</h3>
            <div class="grid" id="catalogGrid"></div>
        </div>
    </div>

    <script>
        const catalog = [
            { id: 1, name: "Скибиди Базовый", emoji: "🚽", price: 10 },
            { id: 2, name: "Сигма Фейс", emoji: "🗿", price: 25 },
            { id: 3, name: "Тралалело Тралала", emoji: "🦈", price: 60 },
            { id: 4, name: "Бомбардиро Крокодило", emoji: "🐊", price: 150 },
            { id: 5, name: "Тунг-Тунг Сахур", emoji: "🪵", price: 400 },
            { id: 6, name: "Абсолютный Огайо", emoji: "👑", price: 1000 }
        ];

        let inventory = [
            { ...catalog[0], uid: 101 },
            { ...catalog[0], uid: 102 },
            { ...catalog[1], uid: 103 }
        ];

        let selectedMy = null;
        let selectedTarget = null;
        let isSpinning = false;
        let currentRotation = 0;

        function render() {
            const invGrid = document.getElementById('inventoryGrid');
            const catGrid = document.getElementById('catalogGrid');
            invGrid.innerHTML = '';
            catGrid.innerHTML = '';

            inventory.forEach(item => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `<span class="emoji">${item.emoji}</span><b>${item.name}</b><br><span class="price">${item.price} Aura</span>`;
                div.onclick = () => { if (!isSpinning) { selectedMy = item; updateArena(); } };
                invGrid.appendChild(div);
            });

            catalog.forEach(item => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `<span class="emoji">${item.emoji}</span><b>${item.name}</b><br><span class="price">${item.price} Aura</span>`;
                div.onclick = () => { if (!isSpinning) { selectedTarget = item; updateArena(); } };
                catGrid.appendChild(div);
            });
        }

        function updateArena() {
            const mySlot = document.getElementById('mySlot');
            const targetSlot = document.getElementById('targetSlot');
            const btn = document.getElementById('upgradeBtn');
            const chanceText = document.getElementById('chanceText');
            const wheel = document.getElementById('wheel');

            if (selectedMy) {
                mySlot.className = 'slot active';
                mySlot.innerHTML = `<span class="emoji">${selectedMy.emoji}</span><b>${selectedMy.name}</b><span class="price">${selectedMy.price} Aura</span>`;
            } else {
                mySlot.className = 'slot';
                mySlot.innerHTML = `<span>Твой предмет</span>`;
            }

            if (selectedTarget) {
                targetSlot.className = 'slot active';
                targetSlot.innerHTML = `<span class="emoji">${selectedTarget.emoji}</span><b>${selectedTarget.name}</b><span class="price">${selectedTarget.price} Aura</span>`;
            } else {
                targetSlot.className = 'slot';
                targetSlot.innerHTML = `<span>Цель апгрейда</span>`;
            }

            if (selectedMy && selectedTarget && selectedTarget.price > selectedMy.price) {
                // Формула шанса с небольшой комиссией (0.9)
                let chance = (selectedMy.price / selectedTarget.price) * 90;
                chance = Math.min(Math.max(chance, 1), 85).toFixed(1);
                chanceText.innerText = chance + '%';
                wheel.style.background = `conic-gradient(#00ff88 0% ${chance}%, #2a2a3d ${chance}% 100%)`;
                btn.disabled = false;
            } else {
                chanceText.innerText = '0%';
                wheel.style.background = `conic-gradient(#2a2a3d 0% 100%)`;
                btn.disabled = true;
            }
        }

        function startUpgrade() {
            if (!selectedMy || !selectedTarget || isSpinning) return;
            isSpinning = true;
            document.getElementById('upgradeBtn').disabled = true;
            document.getElementById('status').innerText = 'Крутим...';
            document.getElementById('status').style.color = '#fff';

            const chance = parseFloat(document.getElementById('chanceText').innerText);
            const roll = Math.random() * 100;
            const win = roll <= chance;

            // Расчет угла остановки стрелки
            const targetAngle = (roll / 100) * 360;
            const extraSpins = 360 * 5;
            currentRotation += extraSpins + (360 - (currentRotation % 360)) + targetAngle;

            const pointer = document.getElementById('pointer');
            pointer.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                // Удаляем старый предмет
                inventory = inventory.filter(i => i.uid !== selectedMy.uid);

                if (win) {
                    document.getElementById('status').innerText = `🎉 УСПЕХ! Получен: ${selectedTarget.name}`;
