<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Апгрейдер Брейнротов</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #12121a; color: #fff; text-align: center; margin: 0; padding: 20px; }
  .card { background: #1e1e2e; border-radius: 20px; padding: 25px; max-width: 450px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid #333; }
  .emoji { font-size: 90px; margin: 10px 0; transition: transform 0.1s; cursor: pointer; user-select: none; }
  .emoji:active { transform: scale(0.9); }
  .stats { font-size: 18px; margin: 15px 0; background: #27273a; padding: 15px; border-radius: 12px; }
  .money { font-size: 32px; font-weight: bold; color: #4ade80; }
  button { width: 100%; padding: 14px; margin: 8px 0; font-size: 16px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; transition: 0.2s; color: white; }
  button:hover { filter: brightness(1.15); }
  button:disabled { background: #444 !important; cursor: not-allowed; opacity: 0.6; }
  .btn-lvl { background: #3b82f6; }
  .btn-mut { background: #a855f7; }
  .btn-rar { background: #f59e0b; }
  .btn-reb { background: #ef4444; }
  #log { margin-top: 15px; font-size: 15px; color: #fbbf24; min-height: 24px; }
</style>
</head>
<body>

<div class="card">
  <h1>🧠 Апгрейдер Брейнротов</h1>
  <div class="money">$<span id="money">100</span></div>
  <div>Доход: <b>$<span id="income">10</span>/сек</b> (клик: +$<span id="clickVal">10</span>)</div>

  <div class="emoji" id="petEmoji" onclick="clickPet()">🍕</div>
  <h2 id="petName">Нубини Пиццанини</h2>

  <div class="stats">
    <div>Редкость: <b id="rarity" style="color:#9ca3af">Обычный</b></div>
    <div>Мутация: <b id="mutation">Обычная (x1)</b></div>
    <div>Уровень: <b id="level">1</b> | Перерождения: <b id="rebirth">x1</b></div>
  </div>

  <button class="btn-lvl" id="btnLvl" onclick="upgradeLevel()">⬆️ Прокачать уровень ($50)</button>
  <button class="btn-mut" id="btnMut" onclick="spinMutation()">🎲 Колесо мутаций ($250)</button>
  <button class="btn-rar" id="btnRar" onclick="upgradeRarity()">⚗️ Крафт-машина: Апгрейд редкости ($400)</button>
  <button class="btn-reb" id="btnReb" onclick="doRebirth()">🔥 Перерождение ($10,000)</button>

  <div id="log">Кликай по брейнроту, чтобы фармить быстрее!</div>
</div>

<script>
  const pets = [
    { name: "Нубини Пиццанини", emoji: "🍕", rarity: "Обычный", color: "#9ca3af" },
    { name: "Тралалеро Тралала", emoji: "🦈", rarity: "Редкий", color: "#3b82f6" },
    { name: "Бомбардиро Крокодило", emoji: "🐊", rarity: "Эпический", color: "#a855f7" },
    { name: "Балерина Капучина", emoji: "☕", rarity: "Легендарный", color: "#f59e0b" },
    { name: "Тунг Тунг Сахур", emoji: "🪵", rarity: "Мифический", color: "#ef4444" },
    { name: "Секретный Сигма", emoji: "🗿", rarity: "Секретный", color: "#ec4899" },
    { name: "OG Гигачад", emoji: "👑", rarity: "OG", color: "#fde047" }
  ];

  const mutations = [
    { name: "Обычная", mult: 1, weight: 40 },
    { name: "Золотая", mult: 2, weight: 30 },
    { name: "Алмазная", mult: 5, weight: 18 },
    { name: "Радужная", mult: 10, weight: 9 },
    { name: "Галактическая", mult: 25, weight: 3 }
  ];

  let money = 100;
  let petIdx = 0;
  let mutIdx = 0;
  let level = 1;
  let rebirthMult = 1;

  function getIncome() {
    return Math.floor((10 * Math.pow(2.8, petIdx)) * level * mutations[mutIdx].mult * rebirthMult);
  }

  function updateUI() {
    const inc = getIncome();
    const lvlCost = Math.floor(50 * Math.pow(1.4, level - 1));
    const rarCost = 400 * Math.pow(3, petIdx);
    const rebCost = 10000 * rebirthMult;

    document.getElementById("money").innerText = money.toLocaleString();
    document.getElementById("income").innerText = inc.toLocaleString();
    document.getElementById("clickVal").innerText = inc.toLocaleString();
    
    document.getElementById("petEmoji").innerText = pets[petIdx].emoji;
    document.getElementById("petName").innerText = pets[petIdx].name;
    
    const rarEl = document.getElementById("rarity");
    rarEl.innerText = pets[petIdx].rarity;
    rarEl.style.color = pets[petIdx].color;

    document.getElementById("mutation").innerText = `${mutations[mutIdx].name} (x${mutations[mutIdx].mult})`;
    document.getElementById("level").innerText = level;
    document.getElementById("rebirth").innerText = "x" + rebirthMult;

    document.getElementById("btnLvl").innerText = `⬆️ Прокачать уровень ($${lvlCost.toLocaleString()})`;
    document.getElementById("btnLvl").disabled = money < lvlCost;

    document.getElementById("btnMut").disabled = money < 250;

    if (petIdx >= pets.length - 1) {
      document.getElementById("btnRar").innerText = "⚗️ Максимальная редкость (OG)!";
      document.getElementById("btnRar").disabled = true;
    } else {
      document.getElementById("btnRar").innerText = `⚗️ Крафт-машина: Шанс 65% ($${rarCost.toLocaleString()})`;
      document.getElementById("btnRar").disabled = money < rarCost;
    }

    document.getElementById("btnReb").innerText = `🔥 Перерождение ($${rebCost.toLocaleString()})`;
    document.getElementById("btnReb").disabled = money < rebCost;
  }

  function log(msg) {
    document.getElementById("log").innerText = msg;
  }

  function clickPet() {
    money += getIncome();
    updateUI();
  }

  function upgradeLevel() {
    const cost = Math.floor(50 * Math.pow(1.4, level - 1));
    if (money >= cost) {
      money -= cost;
      level++;
      log("Уровень повышен!");
      updateUI();
    }
  }

  function spinMutation() {
    if (money >= 250) {
      money -= 250;
      const totalWeight = mutations.reduce((s, m) => s + m.weight, 0);
      let r = Math.random() * totalWeight;
      for (let i = 0; i < mutations.length; i++) {
        if (r < mutations[i].weight) { mutIdx = i; break; }
        r -= mutations[i].weight;
      }
      log(`Выпала мутация: ${mutations[mutIdx].name} (x${mutations[mutIdx].mult})!`);
      updateUI();
    }
  }

  function upgradeRarity() {
    const cost = 400 * Math.pow(3, petIdx);
    if (money >= cost && petIdx < pets.length - 1) {
      money -= cost;
      if (Math.random() < 0.65) {
        petIdx++;
        log(`УСПЕХ! Новый брейнрот: ${pets[petIdx].name}!`);
      } else {
        log("💥 Крафт-машина взорвалась! Редкость не изменилась.");
      }
      updateUI();
    }
  }

  function doRebirth() {
    const cost = 10000 * rebirthMult;
    if (money >= cost) {
      money = 100;
      petIdx = 0;
      mutIdx = 0;
      level = 1;
      rebirthMult *= 2;
      log(`🔥 ПЕРЕРОЖДЕНИЕ! Постоянный множитель теперь x${rebirthMult}!`);
      updateUI();
    }
  }

  setInterval(() => {
    money += getIncome();
    updateUI();
  }, 1000);

  updateUI();
</script>
</body>
</html>
