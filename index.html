<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brainrot Upgrader TMA</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #12121a;
            --card-bg: #1e1e2e;
            --accent: #ff007f;
            --neon: #00f0ff;
            --win: #00ff88;
            --gold: #ffd700;
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 8px;
        }
        h1 {
            font-size: 17px;
            margin: 0;
            color: var(--accent);
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
        }
        .badges {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .balance-badge {
            font-size: 13px;
            background: #252538;
            border: 1px solid var(--gold);
            padding: 5px 10px;
            border-radius: 20px;
            color: var(--gold);
            font-weight: bold;
        }
        .user-badge {
            font-size: 12px;
            background: var(--card-bg);
            padding: 5px 8px;
            border-radius: 20px;
            color: var(--neon);
            font-weight: bold;
            max-width: 90px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #status {
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            min-height: 20px;
            margin-bottom: 8px;
        }
        .arena {
            width: 100%;
            background: var(--card-bg);
            padding: 14px 10px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .slot {
            flex: 1;
            height: 130px;
            border: 2px dashed #444;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 6px;
            background: #161622;
            font-size: 12px;
            cursor: pointer;
        }
        .slot.active {
            border: 2px solid var(--neon);
        }
        .wheel-container {
            position: relative;
            width: 112px;
            height: 112px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(#2a2a3d 0% 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wheel-inner {
            width: 84px;
            height: 84px;
            background: var(--card-bg);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        .pointer {
            position: absolute;
            top: -8px;
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 13px solid var(--accent);
            z-index: 3;
            transform-origin: 50% 64px;
            transition: transform 3s cubic-bezier(0.15, 0.85, 0.25, 1);
        }
        .chance-presets {
            width: 100%;
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }
        .preset-btn {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid #333;
            color: #fff;
            padding: 9px 0;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .preset-btn:active {
            background: #2e2e46;
            border-color: var(--neon);
        }
        .upgrade-btn {
            width: 100%;
            background: linear-gradient(45deg, var(--accent), #7000ff);
            border: none;
            color: white;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            margin-top: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 0, 127, 0.4);
        }
        .upgrade-btn:disabled {
            opacity: 0.4;
            box-shadow: none;
            cursor: not-allowed;
        }
        .tabs {
            display: flex;
            width: 100%;
            gap: 6px;
            margin-top: 14px;
        }
        .tab {
            flex: 1;
            padding: 10px 4px;
            background: var(--card-bg);
            border: none;
            color: #aaa;
            font-weight: bold;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
        }
        .tab.active {
            background: #2c2c44;
            color: #fff;
            border-bottom: 2px solid var(--neon);
        }
        .grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 10px;
            padding-bottom: 20px;
        }
        .card {
            background: var(--card-bg);
            padding: 10px 6px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid transparent;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }
        .card.selected {
            border-color: var(--neon);
            background: #252538;
        }
        .emoji { font-size: 28px; display: block; margin-bottom: 4px; }
        .price { color: var(--win); font-weight: bold; font-size: 11px; display: block; margin-top: 2px; }
        .card-btn {
            margin-top: 6px;
            border: none;
            border-radius: 6px;
            padding: 6px 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .buy-btn {
            background: var(--gold);
            color: #12121a;
        }
        .sell-btn {
            background: #2e2e46;
            color: #ff6b8b;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🧠 BRAINROT UP</h1>
        <div class="badges">
            <div class="balance-badge">💰 <span id="balanceText">20000</span></div>
            <div class="user-badge" id="userName">Игрок</div>
        </div>
    </div>

    <div id="status">Выбери предмет из инвентаря и цель!</div>

    <div class="arena">
        <div class="slot" id="mySlot">
            <span>Твой<br>брейнрот</span>
        </div>

        <div class="wheel-container">
            <div class="pointer" id="pointer"></div>
            <div class="wheel" id="wheel">
                <div class="wheel-inner">
                    <span id="chanceText" style="font-size: 18px; font-weight: bold;">0%</span>
                    <span style="font-size: 9px; color: #aaa;">ШАНС</span>
                </div>
            </div>
        </div>

        <div class="slot" id="targetSlot">
            <span>Цель<br>апгрейда</span>
        </div>
    </div>

    <div class="chance-presets">
        <button type="button" class="preset-btn" data-chance="75">~75%</button>
        <button type="button" class="preset-btn" data-chance="50">~50%</button>
        <button type="button" class="preset-btn" data-chance="25">~25%</button>
        <button type="button" class="preset-btn" data-chance="10">~10%</button>
    </div>

    <button type="button" class="upgrade-btn" id="upgradeBtn" disabled>АПГРЕЙДНУТЬ</button>

    <div class="tabs">
        <button type="button" class="tab active" id="tabInv" data-tab="inv">🎒 Инвентарь (<span id="invCount">0</span>)</button>
        <button type="button" class="tab" id="tabCat" data-tab="cat">🎯 Цели</button>
        <button type="button" class="tab" id="tabShop" data-tab="shop">🛒 Магазин</button>
    </div>

    <div class="grid" id="itemsGrid"></div>

    <script>
        const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
        if (tg) {
            tg.expand();
            tg.ready();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                document.getElementById('userName').innerText = '@' + (tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name);
            }
        }

        const catalog = [
            { id: 1, name: "Скибиди", emoji: "🚽", price: 100 },
            { id: 2, name: "Сигма", emoji: "🗿", price: 250 },
            { id: 3, name: "Тралалело", emoji: "🦈", price: 500 },
            { id: 4, name: "Крокодило", emoji: "🐊", price: 1000 },
