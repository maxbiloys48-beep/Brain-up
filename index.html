<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111114">
<title>BRAIN-UP</title>
<style>
:root{--bg:#101013;--panel:#1b1b20;--panel2:#242429;--yellow:#ffd91a;--muted:#92929b;--green:#c6ec42}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 35%,#202024,#0c0c0e 68%);color:#f7f7f8;font-family:Inter,system-ui,Arial,sans-serif}
header{height:76px;background:#17171b;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #29292e;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;letter-spacing:1px;font-size:20px}.mark{color:var(--yellow);font-size:28px;line-height:1}
.balance{background:#29292e;border:1px solid #45454b;border-radius:13px;padding:10px 12px;color:#fff;font-weight:800}.balance b{color:var(--yellow)}
main{max-width:760px;margin:auto;padding:15px 14px 100px}.topline{display:flex;justify-content:space-between;align-items:center;margin:12px 4px 22px}.topline h1{font-size:18px;letter-spacing:1px;margin:0}.topline span{color:var(--yellow);font-size:12px;font-weight:800}
.wheel-wrap{display:flex;justify-content:center;margin:15px auto 24px}.wheel{width:min(78vw,330px);aspect-ratio:1;border-radius:50%;padding:13px;background:conic-gradient(from 180deg,#f04422 0deg,#ffdc16 90deg,#29292e 90deg 270deg,#ffdc16 270deg,#f04422 360deg);box-shadow:0 0 30px #ffd91a22;transition:transform 2.4s cubic-bezier(.12,.75,.18,1)}
.wheel-inner{height:100%;border-radius:50%;background:radial-gradient(circle,#29292e,#17171a 70%);border:10px solid #111114;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;position:relative}.wheel-inner:after{content:"";position:absolute;bottom:-20px;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:28px solid var(--yellow)}
.chance{font-size:42px;color:var(--green);font-weight:900}.chance-label{color:#b5d84b;font-size:16px}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pick{background:linear-gradient(145deg,#242429,#17171b);border:1px solid #2c2c32;border-radius:12px;min-height:180px;padding:12px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px}
.pick small{color:#c5c5ca;font-size:11px}.placeholder{width:100%;height:95px;border-radius:9px;background:radial-gradient(circle,#40380d,#19191d 65%);display:flex;align-items:center;justify-content:center;color:var(--yellow);font-size:42px;font-weight:900}
.pick strong{font-size:13px}.pick em{font-size:11px;color:var(--muted);font-style:normal}
button{border:0;cursor:pointer;font:inherit}.improve{margin-top:10px;width:100%;height:58px;border-radius:10px;background:linear-gradient(90deg,#b69b00,#ffdf19);color:#171717;font-weight:900;font-size:18px}.improve:disabled{opacity:.55;cursor:not-allowed}
.section{margin-top:20px;background:#17171b;border:1px solid #29292e;border-radius:12px;padding:14px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section h2{font-size:15px;margin:0}.muted{color:var(--muted);font-size:12px}
.search{width:100%;background:#242429;border:1px solid #38383e;color:white;padding:12px;border-radius:9px;outline:none;margin:6px 0 10px}
.catalog{display:grid;grid-template-columns:1fr 1fr;gap:7px;max-height:360px;overflow:auto}.item{background:#222227;border:1px solid #34343a;border-radius:9px;padding:10px;text-align:left;color:white;min-width:0}.item.selected{border-color:var(--yellow);box-shadow:0 0 0 1px #ffd91a55}.item b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item span{color:var(--yellow);font-size:11px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#17171b;border-top:1px solid #303036;display:flex;justify-content:space-around;padding:10px 4px max(10px,env(safe-area-inset-bottom));z-index:6}.nav button{background:none;color:#777780;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px}.nav button.active{color:var(--yellow)}.nav strong{font-size:22px;line-height:22px}
.notice{font-size:11px;color:#85858d;line-height:1.4;margin-top:10px}.status{margin-top:10px;text-align:center;color:var(--green);font-size:13px;min-height:18px}
@media(min-width:600px){.catalog{grid-template-columns:repeat(3,1fr)}.pick{min-height:210px}}
</style>
</head>
<body>
<header><div class="brand"><span class="mark">⌃</span><span>BRAIN-UP</span></div><div class="balance"><b>◈</b> <span id="balance">0</span> 🪙</div></header>
<main>
<div class="topline"><h1>⌃ UPGRADER</h1><span>DEMO MODE</span></div>
<div class="wheel-wrap"><div class="wheel" id="wheel"><div class="wheel-inner"><div class="chance" id="chance">0.00%</div><div class="chance-label">upgrade chance</div></div></div></div>
<div class="picks">
 <button class="pick" id="sourcePick"><small>SELECT YOUR BRAINROT</small><div class="placeholder">⌄</div><strong id="sourceName">Choose from inventory</strong><em id="sourcePrice">Inventory is empty</em></button>
 <button class="pick" id="targetPick"><small>SELECT TARGET BRAINROT</small><div class="placeholder">⌃</div><strong id="targetName">Choose target</strong><em id="targetPrice">From catalog</em></button>
</div>
<button class="improve" id="improve" disabled>⌃ &nbsp; IMPROVE</button>
<div class="status" id="status"></div>
<section class="section">
 <div class="section-head"><h2>BRAINROT CATALOG</h2><span class="muted" id="count"></span></div>
 <input class="search" id="search" placeholder="Search Brainrot..." autocomplete="off">
 <div class="catalog" id="catalog"></div>
 <p class="notice">Цены взяты из предоставленного списка. Каталог отсортирован по цене; повторяющиеся названия объединены. В этой демоверсии нет денежных ставок, пополнений или вывода средств.</p>
</section>
</main>
<nav class="nav"><button><strong>⚔</strong>Battle</button><button class="active"><strong>⌃</strong>Upgrade</button><button><strong>＋</strong>Coins</button><button><strong>♧</strong>Reward</button><button><strong>♛</strong>VIP</button></nav>

const inventory = [];
let source = null, target = null;
const $ = id => document.getElementById(id);
function money(n){return n.toLocaleString("en-US")+" coins"}
function render(list=catalog){
 $("count").textContent=list.length+" items";
 $("catalog").innerHTML="";
 list.forEach(item=>{
  const b=document.createElement("button");b.className="item"+(target?.name===item.name?" selected":"");
  b.innerHTML="<b></b><span></span>";b.querySelector("b").textContent=item.name;b.querySelector("span").textContent=money(item.price);
  b.onclick=()=>{target=item;update();render(list)};
  $("catalog").appendChild(b);
 });
}
function update(){
 $("targetName").textContent=target?.name||"Choose target";
 $("targetPrice").textContent=target?money(target.price):"From catalog";
 $("sourceName").textContent=source?.name||"Choose from inventory";
 $("sourcePrice").textContent=source?money(source.price):"Inventory is empty";
 const p=source&&target?Math.min(100,source.price/target.price*100):0;
 $("chance").textContent=p.toFixed(2)+"%";
 $("improve").disabled=!(source&&target);
}
$("search").addEventListener("input",e=>{const q=e.target.value.toLowerCase();render(catalog.filter(x=>x.name.toLowerCase().includes(q)))});
$("sourcePick").onclick=()=>{$("status").textContent="В инвентаре пока нет Brainrots. Сначала добавьте предметы в игровую версию.";};
$("targetPick").onclick=()=>{$("search").focus();$("status").textContent="Выбери цель в каталоге ниже.";};
$("improve").onclick=()=>{if(!source||!target)return;$("wheel").style.transform="rotate(1080deg)";$("status").textContent="Демо-анимация. Реальная система инвентаря подключается на сервере.";setTimeout(()=>{$("wheel").style.transform="";},2500)};
render();update();
</script>
</body></html>
